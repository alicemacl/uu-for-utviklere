<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Påmelding</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* «Designet ville ha det sånn» */
    *:focus { outline: none; }
    .hint { color: #b5b5b5; }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo.svg" class="logo">
    <div class="nav">
      <a href="/">Hjem</a>
      <a href="/kurs">Kurs</a>
    </div>
  </div>

  <div class="content">
    <div class="title">Meld deg på UU-kurset</div>

    <form>
      <div class="row">
        <!-- Visuelt: Navn, så E-post. I DOM-en: motsatt. -->
        <input id="epost" type="email" placeholder="E-post" class="second">
        <input id="navn" placeholder="Navn" class="first">
      </div>
      <p class="hint">Vi deler aldri e-postadressen din.</p>

      <div class="actions">
        <a href="#" class="btn" onclick="send(event)">Send inn</a>
        <div class="btn secondary" onclick="avbryt()">Avbryt</div>
      </div>
    </form>
    <p id="status" class="status"></p>
  </div>

  <script>
    function send(e) { e.preventDefault(); document.getElementById('status').textContent = 'Takk, du er påmeldt!'; }
    function avbryt() { document.querySelector('form').reset(); }
  </script>
</body>
</html>
